
spring:
  application:
    name: shipment-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8085}"

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    listener:
      simple:
        auto-startup: ${RABBITMQ_LISTENER_AUTO_STARTUP:false}
  security:
    jwt:
      secret-key: ${SECURITY_JWT_SECRET_KEY:}
      issuer: ${SECURITY_JWT_ISSUER:logitrack-security}
