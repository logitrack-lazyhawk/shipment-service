spring:
  application:
    name: shipment-service
  config:
    import: "optional:configserver:http://localhost:8085"
  profiles:
    active: dev
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          courier-service:
            connectTimeout: 2000
            readTimeout: 3000

resilience4j:
  circuitbreaker:
    configs:
      default:
        ignoreExceptions:
          - java.lang.IllegalArgumentException
          - com.logitrack.shipmentservice.dominio.exception.ReglaNegocioException
          - feign.FeignException$BadRequest
          - feign.FeignException$NotFound
  timelimiter:
    configs:
      default:
        timeoutDuration: 6s
